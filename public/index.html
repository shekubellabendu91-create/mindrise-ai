<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MindRise AI</title><style>body{font-family:Arial;background:#080d18;color:white;max-width:850px;margin:auto;padding:25px}section{background:#121b2c;padding:22px;border-radius:16px;margin:16px 0}input,textarea,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;box-sizing:border-box}button{background:#7565ff;color:white;border:0;font-weight:bold}textarea{min-height:120px}</style></head><body><h1>⚡ MindRise AI</h1><p>Turn your ideas into video projects.</p><section><h2>Start creating</h2><input id="email" placeholder="Your email"><button onclick="start()">Continue</button><p id="status"></p></section><section><h2>Plans</h2><p>Free: 3 credits</p><p>Creator: $9.99/month</p><p>Pro: $19.99/month</p></section><section id="studio" hidden><h2>🎬 Video Studio</h2><textarea id="topic" placeholder="Enter your video topic"></textarea><select id="length"><option>2</option><option selected>4</option><option>5</option><option>8</option></select><select id="style"><option>Motivational</option><option>Educational</option><option>Storytelling</option><option>Business</option></select><button onclick="createProject()">Create project</button><pre id="result"></pre></section><script>let account=null;async function start(){let email=document.getElementById('email').value.trim();let r=await fetch('/api/account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});let x=await r.json();if(!r.ok)return alert(x.error);account=x;document.getElementById('studio').hidden=false;document.getElementById('status').textContent='Free account active.'}async function createProject(){let topic=document.getElementById('topic').value.trim();let r=await fetch('/api/create-video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:account.email,topic,length:document.getElementById('length').value,style:document.getElementById('style').value})});document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
