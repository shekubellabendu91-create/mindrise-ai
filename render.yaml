services:
  - type: web
    name: mindrise-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_CREATOR_PRICE_ID
        sync: false
      - key: PADDLE_PRO_PRICE_ID
        sync: false
